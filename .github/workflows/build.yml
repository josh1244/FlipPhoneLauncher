name: Build

on:
  push:
    branches: [ main, modular ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the default package set (which includes the obsolete "tools" package that
          # no longer exists and fails the action); install exactly what the build needs.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Make gradlew executable
        run: chmod +x apps/launcher/gradlew

      - name: Build debug APK
        run: cd apps/launcher && ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  basic-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'

      - name: Download apktool
        run: curl -fsSL -o "$RUNNER_TEMP/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Build Basic Messaging (dark + light)
        env:
          APKTOOL: ${{ runner.temp }}/apktool.jar
          BT: ${{ env.ANDROID_HOME }}/build-tools/35.0.0
          JAVA: java
        run: |
          chmod +x apps/basic-messaging/build.sh
          apps/basic-messaging/build.sh both

      - name: Build Basic Camera
        env:
          APKTOOL: ${{ runner.temp }}/apktool.jar
          BT: ${{ env.ANDROID_HOME }}/build-tools/35.0.0
          JAVA: java
        run: |
          chmod +x apps/basic-camera/build.sh
          apps/basic-camera/build.sh

      - name: Build Basic Weather
        env:
          APKTOOL: ${{ runner.temp }}/apktool.jar
          BT: ${{ env.ANDROID_HOME }}/build-tools/35.0.0
          JAVA: java
        run: |
          chmod +x apps/basic-weather/build.sh
          apps/basic-weather/build.sh

      - name: Upload messaging APKs
        uses: actions/upload-artifact@v4
        with:
          name: basic-messaging
          path: apps/basic-messaging/BasicMessaging-*.apk
          if-no-files-found: error

      - name: Upload camera APK
        uses: actions/upload-artifact@v4
        with:
          name: basic-camera
          path: apps/basic-camera/BasicCamera.apk
          if-no-files-found: error

      - name: Upload weather APK
        uses: actions/upload-artifact@v4
        with:
          name: basic-weather
          path: apps/basic-weather/BasicWeather.apk
          if-no-files-found: error
